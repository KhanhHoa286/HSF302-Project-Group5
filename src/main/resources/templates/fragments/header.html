<header th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-white sticky-top" style="z-index: 1050;"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-briefcase-fill me-2"></i>JobPortal
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${activePage == 'home' ? 'active fw-bold text-primary' : ''}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/candidate/jobs/list-job}"
                       th:classappend="${activePage == 'jobs' ? 'active fw-bold text-primary' : ''}">Việc làm</a>
                </li>
                <li class="nav-item" th:if="${#authorization.expression('hasAuthority(''RECRUITER'')')}">
                    <a class="nav-link" th:href="@{/recruiter/list-job-posts}"
                       th:classappend="${activePage == 'recruiters' ? 'active fw-bold text-primary' : ''}">Nhà tuyển dụng</a>
                </li>
            </ul>

            <!-- Khi chưa đăng nhập -->
            <div th:if="${#authorization.expression('isAnonymous()')}" class="d-flex align-items-center gap-2">
                <a th:href="@{/register}" class="btn btn-topcv-register" th:classappend="${activePage == 'register' ? 'active' : ''}">Đăng ký</a>
                <a th:href="@{/login}" class="btn btn-topcv-login" th:classappend="${activePage == 'login' ? 'active' : ''}">Đăng nhập</a>
                <a th:href="@{/register-recruiter}" class="btn btn-topcv-recruiter" th:classappend="${activePage == 'register-recruiter' ? 'active' : ''}">Đăng tuyển & tìm hồ sơ</a>
            </div>

            <!-- Khi đã đăng nhập (cả tài khoản thường và Google) -->
            <div th:if="${#authorization.expression('isAuthenticated()')}" class="dropdown d-flex align-items-center gap-2">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <img th:src="${#authentication.principal.avatarUrl != null and #authentication.principal.avatarUrl != '' ? #authentication.principal.avatarUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" 
                         alt="Avatar" class="rounded-circle me-2" style="width: 32px; height: 32px; object-fit: cover;">
                    <span class="text-dark fw-bold" th:text="${#authentication.principal.fullName}">User Name</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Trang cá nhân</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="POST" class="m-0">
                            <button type="submit" class="dropdown-item py-2 text-danger border-0 bg-transparent w-100 text-start">
                                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
