<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Từ chối truy cập - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/error.css">
</head>
<body>
    <div class="error-card error-forbidden">
        <div class="icon-container">
            <i class="bi bi-shield-lock-fill icon-3rem"></i>
        </div>
        <div class="error-code">403</div>
        <h2 class="error-title">Truy cập bị từ chối!</h2>
        <p class="error-desc">
            Bạn không có quyền truy cập vào trang này. Vui lòng kiểm tra lại tài khoản hoặc liên hệ với quản trị viên nếu bạn tin rằng đây là một sự nhầm lẫn.
        </p>
        <div class="d-flex justify-content-center">
            <button type="button" onclick="history.back()" class="btn-outline-custom">Quay lại</button>
            <a th:href="@{/}" class="btn-custom">Trang chủ</a>
        </div>
    </div>
</body>
</html>
