<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/error.css">
</head>
<body>
    <div class="error-card error-notfound">
        <div class="icon-container">
            <i class="bi bi-compass-fill" style="font-size: 3rem;"></i>
        </div>
        <div class="error-code">404</div>
        <h2 class="error-title">Không tìm thấy trang!</h2>
        <p class="error-desc">
            Trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển sang một đường dẫn khác. Vui lòng kiểm tra lại URL của bạn.
        </p>
        <div class="d-flex justify-content-center">
            <button type="button" onclick="history.back()" class="btn-outline-custom">Quay lại</button>
            <a th:href="@{/}" class="btn-custom">Trang chủ</a>
        </div>
    </div>
</body>
</html>
