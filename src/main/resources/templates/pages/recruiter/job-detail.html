<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết tin tuyển dụng - JobPortal</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" th:href="@{/assets/css/common.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/recruiter.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="recruiter-layout">
    <div
            th:replace="~{fragments/recruiter-sidebar :: recruiter-sidebar}"
    ></div>

    <main class="recruiter-content">
        <div class="mb-4">
            <a th:href="@{/recruiter/list-job-posts}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Quay lại
            </a>
        </div>

        <div class="row">
            <!-- Nội dung chính JD -->
            <div class="col-lg-8 mb-4">
                <div class="card card-custom p-4 mb-4">
                    <h3 class="fw-bold text-primary mb-3" th:text="${jobDetail.title}">

                    </h3>

                    <div class="row g-3 mb-4 text-muted border-bottom pb-4">
                        <div class="col-md-6">
                            <i class="bi bi-cash-stack text-success me-2"></i>
                            <span th:text="${jobDetail.salaryDisplay}"></span>
                        </div>
                        <div class="col-md-6" >
                            <i class="bi bi-geo-alt text-danger me-2"></i>
                            <span th:text="${jobDetail.locationDetail}"></span>
                        </div>
                        <div class="col-md-6" >
                            <i class="bi bi-briefcase text-primary me-2"></i>
                            <span th:text="'Kinh nghiệm: ' + ${jobDetail.jobLevel}"></span>
                        </div>
                        <div class="col-md-6"  >
                            <i class="bi bi-clock-history text-warning me-2"></i>
                            <span th:text="'Loại hình: ' + ${jobDetail.employmentType}"></span>
                        </div>
                        <div class="col-md-6 text-break">
                            <i class="bi bi-tools text-info me-2"></i>
                            <span>Kĩ năng: 
                                <span th:text="${#strings.arrayJoin(jobDetail.skillsName,', ')}"></span>
                            </span>
                        </div>
                        <div class="col-md-6" >
                            <i class="bi bi-calendar-x text-secondary me-2"></i>
                            <span  th:text="'Hạn nộp: '+ ${#temporals.format(jobDetail.expiredDate,'dd-MM-yyyy')}"></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h5
                                class="fw-bold mb-3 border-start border-primary border-4 ps-2"
                        >
                            Mô tả công việc
                        </h5>
                        <ul class="text-muted">
                            <li class="mb-2"  th:text="${jobDetail.description}"></li>
                        </ul>
                    </div>

                    <div class="mb-4">
                        <h5
                                class="fw-bold mb-3 border-start border-primary border-4 ps-2"
                        >
                            Yêu cầu ứng viên
                        </h5>
                        <ul class="text-muted">
                            <li class="mb-2"  th:text="${jobDetail.requirement}"></li>
                        </ul>
                    </div>
                    <div class="mb-4">
                        <h5
                                class="fw-bold mb-3 border-start border-primary border-4 ps-2"
                        >
                            Quyển lợi
                        </h5>
                        <ul class="text-muted">
                                <li class="mb-2" th:if="${not #strings.isEmpty(jobDetail.benefit)}" th:text="${jobDetail.benefit}"></li>
                                <li class="mb-2"  th:if="${#strings.isEmpty(jobDetail.benefit)}" th:text="'Trống'"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Khối thao tác Recruiter -->
            <div class="col-lg-4">
                <div class="card card-custom p-4 mb-4 sticky-top sticky-offset-90">
                    <div
                            class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom"
                    >
                        <img
                                th:src="${jobDetail.company.logoUrl}"
                                alt="Logo"
                                class="rounded border p-1 w-60"
                        />
                        <div>
                            <h6 class="fw-bold mb-1" th:text="${jobDetail.company.companyName}"></h6>
                            <a
                                    href="company-profile.html"
                                    class="small text-decoration-none"
                            >Cập nhật hồ sơ công ty</a
                            >
                        </div>
                    </div>

                    <h5 class="fw-bold mb-3">Thông tin bài đăng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Trạng thái:</span>
                        <span class="badge " th:classappend="${jobDetail.status.name() == 'APPROVED' ? 'bg-success' : (jobDetail.status.name() == 'PENDING' ? 'bg-warning' : (jobDetail.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-secondary'))}" th:text="${jobDetail.status.displayName}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Số ứng viên:</span>
                        <span class="fw-bold text-success" th:text="${jobDetail.vacancies}"></span>
                    </div>

                    <hr class="my-4 text-muted" />

                    <a
                            th:href="@{/recruiter/update-job/{id}(id=${jobDetail.jobId})}"
                            class="btn btn-outline-primary-custom w-100 mb-2"
                    ><i class="bi bi-pencil me-2"></i>Chỉnh sửa tin này</a
                    >
                    <form th:action="@{/recruiter/update-status-job}" method="POST"
                          th:if="${jobDetail.status.name() == 'APPROVED' || jobDetail.status.name() == 'CLOSED'}">
                        <input type="hidden" th:value="${jobDetail.jobId}" name="job_id">
                        <input type="hidden" th:value="${jobDetail.status}" name="status">
                    <button
                            th:class= "${jobDetail.status.name() == 'APPROVED'? 'btn btn-outline-danger w-100' : 'btn btn-outline-success w-100'}";
                            data-bs-toggle="modal"
                            data-bs-target="#closeJobModal"
                            th:text="${jobDetail.status.name() == 'APPROVED' ? 'Đóng tin ngay' : 'Mở tin ngay'}"
                    >
                        <i class="bi bi-stop-circle me-2"></i>
                    </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
