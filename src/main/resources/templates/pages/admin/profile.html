<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - JobPortal Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('profile')}"></div>

    <main class="admin-content">
        <h3 class="fw-bold mb-4">Thông tin cá nhân</h3>

        <div class="card card-custom p-4 shadow-sm">
            <div class="d-flex align-items-center gap-3 border-bottom pb-4 mb-4">
                <img th:src="${admin.avatarUrl != null && !admin.avatarUrl.isEmpty() ? admin.avatarUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"
                     class="rounded-circle border admin-profile-avatar"
                     alt="Avatar">
                <div>
                    <h4 class="fw-bold mb-1" th:text="${admin.fullName}">Nguyễn Quản Trị</h4>
                    <span class="badge bg-danger">
                        <i class="bi bi-shield-lock me-1"></i>Admin
                    </span>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <strong class="d-block text-secondary mb-1">Email</strong>
                    <span th:text="${admin.email}">admin@jobportal.vn</span>
                </div>
                <div class="col-md-6">
                    <strong class="d-block text-secondary mb-1">Số điện thoại</strong>
                    <span th:text="${admin.phone != null && !admin.phone.isEmpty() ? admin.phone : 'Chưa cập nhật'}">Chưa cập nhật</span>
                </div>
                <div class="col-md-6">
                    <strong class="d-block text-secondary mb-1">Giới tính</strong>
                    <span th:text="${admin.gender != null ? admin.gender.value : 'Chưa cập nhật'}">Chưa cập nhật</span>
                </div>
                <div class="col-md-6">
                    <strong class="d-block text-secondary mb-1">Trạng thái tài khoản</strong>
                    <span th:if="${admin.status.name() == 'ACTIVE'}" class="badge bg-success">Hoạt động</span>
                    <span th:if="${admin.status.name() != 'ACTIVE'}" class="badge bg-secondary">Đang khóa</span>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
