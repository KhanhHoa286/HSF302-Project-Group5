<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý doanh nghiệp - JobPortal Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" th:href="@{/assets/css/common.css}">
  <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>

<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('company-management')}"></div>

    <main class="admin-content">
      <!-- Flash message -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Quản lý doanh nghiệp</h3>
        <button class="btn btn-primary-custom px-3"><i class="bi bi-plus-lg me-2"></i>Thêm doanh nghiệp</button>
      </div>

      <div class="card card-custom p-4">
        <!-- Bộ lọc -->
        <form th:action="@{/admin/companies/list}" method="get" class="row g-3 mb-4">
          <div class="col-md-8">
            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
              placeholder="Tên công ty hoặc email...">
          </div>
          <div class="col-md-4">
            <select class="form-select" name="status" onchange="this.form.submit()">
              <option value="" th:selected="${statusFilter == null}">Trạng thái</option>
              <option value="ACTIVE" th:selected="${statusFilter != null && statusFilter.name() == 'ACTIVE'}">Hoạt động
              </option>
              <option value="INACTIVE" th:selected="${statusFilter != null && statusFilter.name() == 'INACTIVE'}">Tạm
                khóa</option>
            </select>
          </div>
        </form>

        <!-- Bảng danh sách -->
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th class="col-logo">Logo</th>
                <th>Tên công ty</th>
                <th>Website</th>
                <th>Email</th>
                <th>Trạng thái</th>
                <th class="text-end">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${companyPage.content}">
                <td>
                  <img
                    th:src="${#strings.isEmpty(c.logoUrl) ? 'https://ui-avatars.com/api/?name=' + c.companyName + '&background=random&color=fff&size=40' : c.logoUrl}"
                    class="company-logo-sm rounded border" alt="Logo">
                </td>
                <td>
                  <div class="fw-bold" th:text="${c.companyName}">TechCorp Vietnam</div>
                </td>
                <td>
                  <a th:if="${!#strings.isEmpty(c.website)}" th:href="${c.website}" class="text-decoration-none"
                    target="_blank" th:text="${c.website}">techcorp.vn</a>
                  <span th:if="${#strings.isEmpty(c.website)}" class="text-muted small">Không có</span>
                </td>
                <td class="text-muted small" th:text="${c.email}">hr@techcorp.vn</td>
                <td>
                  <span th:if="${c.status == 'ACTIVE'}" class="badge bg-success">Hoạt động</span>
                  <span th:if="${c.status == 'INACTIVE'}" class="badge bg-secondary">Tạm khóa</span>
                </td>
                <td class="text-end">
                  <!-- Xem chi tiết -->
                  <a th:href="@{/admin/companies/detail/{id}(id=${c.companyId})}"
                    class="btn btn-sm btn-outline-primary-custom me-1" title="Xem">
                    <i class="bi bi-eye"></i>
                  </a>

                  <!-- Form post lock/unlock -->
                  <form th:action="@{/admin/companies/edit/{id}(id=${c.companyId})}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="INACTIVE" th:if="${c.status == 'ACTIVE'}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Khóa"
                      th:if="${c.status == 'ACTIVE'}"
                      onclick="return confirm('Bạn có muốn tạm khóa doanh nghiệp này không?')">
                      <i class="bi bi-lock-fill"></i>
                    </button>

                    <input type="hidden" name="status" value="ACTIVE" th:if="${c.status == 'INACTIVE'}" />
                    <button type="submit" class="btn btn-sm btn-outline-success" title="Kích hoạt"
                      th:if="${c.status == 'INACTIVE'}"
                      onclick="return confirm('Bạn có muốn kích hoạt doanh nghiệp này không?')">
                      <i class="bi bi-unlock-fill"></i>
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(companyPage.content)}">
                <td colspan="6" class="text-center py-4 text-muted">Không tìm thấy doanh nghiệp nào phù hợp.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Phân trang -->
        <nav aria-label="Page navigation" class="mt-3" th:if="${companyPage.totalPages > 0}">
          <ul class="pagination justify-content-end mb-0">
            <li class="page-item" th:classappend="${companyPage.first ? 'disabled' : ''}">
              <a class="page-link"
                th:href="@{/admin/companies/list(page=${companyPage.number - 1}, keyword=${keyword}, status=${statusFilter})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, companyPage.totalPages - 1)}"
              th:classappend="${companyPage.number == i ? 'active' : ''}">
              <a class="page-link"
                th:href="@{/admin/companies/list(page=${i}, keyword=${keyword}, status=${statusFilter})}"
                th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${companyPage.last ? 'disabled' : ''}">
              <a class="page-link"
                th:href="@{/admin/companies/list(page=${companyPage.number + 1}, keyword=${keyword}, status=${statusFilter})}">Sau</a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
