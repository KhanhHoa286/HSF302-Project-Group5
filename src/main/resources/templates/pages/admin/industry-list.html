<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý ngành nghề - JobPortal Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>

<body>

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<div class="admin-layout">
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('industry-management')}"></div>

    <main class="admin-content">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Thành công</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Có lỗi xảy ra</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Quản lý ngành nghề</h3>
            <button class="btn btn-primary-custom px-3" data-bs-toggle="modal" data-bs-target="#addIndustryModal">
                <i class="bi bi-plus-lg me-2"></i>Thêm ngành nghề
            </button>
        </div>

        <div class="card card-custom p-4">
            <form th:action="@{/admin/industries/list}" method="get" class="row g-3 mb-4">
                <div class="col-md-8">
                    <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                           placeholder="Tìm kiếm tên ngành nghề...">
                </div>
                <div class="col-md-4">
                    <select class="form-select" name="status" onchange="this.form.submit()">
                        <option value="" th:selected="${statusFilter == null}">Trạng thái</option>
                        <option th:each="st : ${industryStatuses}"
                                th:value="${st}"
                                th:selected="${statusFilter == st}"
                                th:text="${st.displayName}"></option>
                    </select>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên ngành nghề</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="industry : ${industryPage.content}">
                        <td><span class="fw-bold text-muted" th:text="${industry.industryId}">1</span></td>
                        <td><div class="fw-bold text-primary" th:text="${industry.industryName}">Information Technology</div></td>
                        <td>
                            <span th:if="${industry.status.name() == 'ACTIVE'}" class="badge bg-success">Hoạt động</span>
                            <span th:if="${industry.status.name() == 'INACTIVE'}" class="badge bg-secondary">Không hoạt động</span>
                        </td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-primary-custom me-1" title="Sửa"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editIndustryModal' + ${industry.industryId}">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{/admin/industries/status/{id}(id=${industry.industryId})}" method="post" class="d-inline">
                                <input th:if="${industry.status.name() == 'ACTIVE'}" type="hidden" name="status" value="INACTIVE">
                                <button th:if="${industry.status.name() == 'ACTIVE'}" type="submit"
                                        class="btn btn-sm btn-outline-danger" title="Khóa"
                                        onclick="return confirm('Bạn có muốn khóa ngành nghề này không?')">
                                    <i class="bi bi-lock-fill"></i>
                                </button>
                                <input th:if="${industry.status.name() == 'INACTIVE'}" type="hidden" name="status" value="ACTIVE">
                                <button th:if="${industry.status.name() == 'INACTIVE'}" type="submit"
                                        class="btn btn-sm btn-outline-success" title="Kích hoạt"
                                        onclick="return confirm('Bạn có muốn kích hoạt ngành nghề này không?')">
                                    <i class="bi bi-unlock-fill"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(industryPage.content)}">
                        <td colspan="4" class="text-center py-4 text-muted">Không tìm thấy ngành nghề nào phù hợp.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation" class="mt-3" th:if="${industryPage.totalPages > 0}">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item" th:classappend="${industryPage.first ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/industries/list(page=${industryPage.number - 1}, keyword=${keyword}, status=${statusFilter})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, industryPage.totalPages - 1)}"
                        th:classappend="${industryPage.number == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/industries/list(page=${i}, keyword=${keyword}, status=${statusFilter})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${industryPage.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/industries/list(page=${industryPage.number + 1}, keyword=${keyword}, status=${statusFilter})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
</div>

<div class="modal fade" id="addIndustryModal" tabindex="-1" aria-labelledby="addIndustryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/industries/add}" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="addIndustryModalLabel">Thêm ngành nghề mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên ngành nghề <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="industryName" placeholder="VD: Information Technology" required maxlength="100">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold">Trạng thái</label>
                        <select class="form-select" name="status">
                            <option th:each="st : ${industryStatuses}"
                                    th:value="${st}"
                                    th:selected="${st.name() == 'ACTIVE'}"
                                    th:text="${st.displayName}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary-custom px-4">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:each="industry : ${industryPage.content}"
     class="modal fade"
     th:id="'editIndustryModal' + ${industry.industryId}"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/industries/edit/{id}(id=${industry.industryId})}" method="post">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Sửa ngành nghề</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên ngành nghề <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="industryName"
                               th:value="${industry.industryName}" required maxlength="100">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold">Trạng thái</label>
                        <select class="form-select" name="status">
                            <option th:each="st : ${industryStatuses}"
                                    th:value="${st}"
                                    th:selected="${industry.status == st}"
                                    th:text="${st.displayName}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary-custom px-4">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
