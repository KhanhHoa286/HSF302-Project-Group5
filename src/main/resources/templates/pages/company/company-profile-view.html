<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Doanh nghiệp - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link th:if="${#authorization.expression('hasAuthority(''CANDIDATE'')')}" rel="stylesheet" th:href="@{/assets/css/candidate.css}">
    <link th:if="${#authorization.expression('hasAuthority(''RECRUITER'')')}" rel="stylesheet" th:href="@{/assets/css/recruiter.css}">
    <link th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}" rel="stylesheet" th:href="@{/assets/css/admin.css}">
    <link rel="stylesheet" th:href="@{/assets/css/profile.css}">
</head>
<body>

<div th:replace="~{fragments/header.html :: header}"></div>

<div th:class="${#authorization.expression('hasAuthority(''ADMIN'')')} ? 'admin-layout' : (${#authorization.expression('hasAuthority(''RECRUITER'')')} ? 'recruiter-layout' : 'candidate-layout')">
    <th:block th:if="${#authorization.expression('hasAuthority(''CANDIDATE'')')}">
        <div th:replace="~{fragments/candidate-sidebar.html :: candidate-sidebar}"></div>
    </th:block>
    <th:block th:if="${#authorization.expression('hasAuthority(''RECRUITER'')')}">
        <div th:replace="~{fragments/recruiter-sidebar.html :: recruiter-sidebar}"></div>
    </th:block>
    <th:block th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}">
        <div th:replace="~{fragments/admin-sidebar.html :: admin-sidebar(activePage='companies')}"></div>
    </th:block>

    <main th:class="${#authorization.expression('hasAuthority(''ADMIN'')')} ? 'admin-content container py-4' : (${#authorization.expression('hasAuthority(''RECRUITER'')')} ? 'recruiter-content container py-4' : 'candidate-content container py-4')">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card profile-section p-4">
                    <div class="profile-section-title">
                        <span>Thông tin doanh nghiệp</span>
                    </div>
                    <div class="d-flex align-items-center mb-4">
                        <div class="avatar-container me-4">
                            <img th:src="${company.logoUrl != null && !company.logoUrl.isEmpty() ? company.logoUrl : 'https://ui-avatars.com/api/?name=' + company.companyName + '&background=random&color=fff&size=100'}" class="avatar-img" alt="Logo">
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${company.companyName}"></h4>
                            <p class="text-muted mb-0" th:text="${company.email}"></p>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Số điện thoại</label>
                            <p class="fw-500 mb-0" th:text="${company.phone != null && !company.phone.isEmpty() ? company.phone : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Website</label>
                            <p class="fw-500 mb-0">
                                <a th:if="${company.website != null && !company.website.isEmpty()}" th:href="${company.website}" target="_blank" th:text="${company.website}"></a>
                                <span th:if="${company.website == null || company.website.isEmpty()}">Chưa cập nhật</span>
                            </p>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Địa chỉ</label>
                            <p class="fw-500 mb-0" th:text="${company.addressDetail != null && !company.addressDetail.isEmpty() ? company.addressDetail : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-12 mt-3">
                            <label class="form-label text-muted small fw-bold">Giới thiệu công ty</label>
                            <p class="fw-500 mb-0" th:text="${company.description != null && !company.description.isEmpty() ? company.description : 'Chưa cập nhật'}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer.html :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
