<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link th:if="${isReadOnly == null or !isReadOnly}" rel="stylesheet" th:href="@{/assets/css/candidate.css}">
    <link th:if="${isReadOnly != null and isReadOnly and #authorization.expression('hasAuthority(''RECRUITER'')')}" rel="stylesheet" th:href="@{/assets/css/recruiter.css}">
    <link th:if="${isReadOnly != null and isReadOnly and #authorization.expression('hasAuthority(''ADMIN'')')}" rel="stylesheet" th:href="@{/assets/css/admin.css}">
    <link rel="stylesheet" th:href="@{/assets/css/profile.css}">
</head>
<body>

<div th:replace="~{fragments/header.html :: header}"></div>


<div th:class="${isReadOnly != null and isReadOnly} ? 'recruiter-layout' : 'candidate-layout'">
    <th:block th:if="${isReadOnly == null or !isReadOnly}">
        <div th:replace="~{fragments/candidate-sidebar.html :: candidate-sidebar(activePage='profile')}"></div>
    </th:block>
    <th:block th:if="${isReadOnly != null and isReadOnly and #authorization.expression('hasAuthority(''RECRUITER'')')}">
        <div th:replace="~{fragments/recruiter-sidebar.html :: recruiter-sidebar}"></div>
    </th:block>
    <th:block th:if="${isReadOnly != null and isReadOnly and #authorization.expression('hasAuthority(''ADMIN'')')}">
        <div th:replace="~{fragments/admin-sidebar.html :: admin-sidebar(activePage='profile')}"></div>
    </th:block>

    <main th:class="${isReadOnly != null and isReadOnly} ? 'recruiter-content container py-4' : 'candidate-content container py-4'">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Hồ sơ cá nhân</h3>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card profile-section p-4">
                    <div class="profile-section-title">
                        <span>Thông tin cá nhân</span>
                        <button th:if="${isReadOnly == null or !isReadOnly}" class="btn btn-sm btn-outline-primary-custom" data-bs-toggle="modal" data-bs-target="#editPersonalModal">
                            <i class="bi bi-pencil me-1"></i> Chỉnh sửa
                        </button>
                    </div>
                    <div class="d-flex align-items-center mb-4">
                        <div class="avatar-container me-4">
                            <img th:src="${profile.avatarUrl != null && !profile.avatarUrl.isEmpty() ? profile.avatarUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar-img" alt="Avatar">
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${profile.fullName}"></h4>
                            <p class="text-muted mb-0" th:text="${profile.email}"></p>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Số điện thoại</label>
                            <p class="fw-500 mb-0" th:text="${profile.phone != null && !profile.phone.isEmpty() ? profile.phone : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Giới tính</label>
                            <p class="fw-500 mb-0" th:text="${profile.gender != null ? profile.gender.value : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Ngày sinh</label>
                            <p class="fw-500 mb-0" th:text="${profile.dateOfBirth != null ? #temporals.format(profile.dateOfBirth, 'dd/MM/yyyy') : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Địa chỉ</label>
                            <p class="fw-500 mb-0" th:text="${profile.addressDetail != null && !profile.addressDetail.isEmpty() ? profile.addressDetail : 'Chưa cập nhật'}"></p>
                        </div>
                        <div class="col-12 mt-3">
                            <label class="form-label text-muted small fw-bold">Giới thiệu bản thân</label>
                            <p class="fw-500 mb-0" th:text="${profile.summary != null && !profile.summary.isEmpty() ? profile.summary : 'Chưa cập nhật'}"></p>
                        </div>
                    </div>
                </div>

                <div class="card profile-section p-4">
                    <div class="profile-section-title">
                        <span>Học vấn</span>
                        <button th:if="${isReadOnly == null or !isReadOnly}" class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addEducationModal">
                            <i class="bi bi-plus-lg me-1"></i> Thêm học vấn
                        </button>
                    </div>
                    <div th:if="${#lists.isEmpty(profile.educations)}" class="text-center py-4 text-muted">
                        <i class="bi bi-mortarboard fs-2 mb-2 d-block"></i>
                        <span>Chưa có thông tin học vấn.</span>
                    </div>
                    <div th:each="edu : ${profile.educations}" class="d-flex mb-3 pb-3 border-bottom justify-content-between align-items-start">
                        <div class="d-flex">
                            <div class="bg-light p-3 rounded me-3 text-center square-50">
                                <i class="bi bi-mortarboard text-primary fs-4"></i>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${edu.degree + ' ' + edu.major}"></h6>
                                <p class="text-muted mb-1" th:text="${edu.schoolName}"></p>
                                <span class="badge bg-light text-secondary" th:text="${#temporals.format(edu.startDate, 'MM/yyyy') + ' - ' + (edu.endDate != null ? #temporals.format(edu.endDate, 'MM/yyyy') : 'Hiện tại')}"></span>
                            </div>
                        </div>
                        <div th:if="${isReadOnly == null or !isReadOnly}">
                            <form th:id="${'delete-edu-form-' + edu.educationId}" th:action="@{/candidate/profile/delete-education}" method="post" class="d-none">
                                <input type="hidden" name="educationId" th:value="${edu.educationId}">
                            </form>
                            <button type="button" class="btn btn-sm btn-outline-danger border-0" th:onclick="'confirmDeleteEdu(' + ${edu.educationId} + ')'">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card profile-section p-4">
                    <div class="profile-section-title">
                        <span>Kinh nghiệm làm việc</span>
                        <button th:if="${isReadOnly == null or !isReadOnly}" class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addExperienceModal">
                            <i class="bi bi-plus-lg me-1"></i> Thêm kinh nghiệm
                        </button>
                    </div>
                    <div th:if="${#lists.isEmpty(profile.experiences)}" class="text-center py-4 text-muted">
                        <i class="bi bi-briefcase fs-2 mb-2 d-block"></i>
                        <span>Chưa có thông tin kinh nghiệm làm việc.</span>
                    </div>
                    <ul class="timeline" th:if="${!#lists.isEmpty(profile.experiences)}">
                        <li th:each="exp : ${profile.experiences}">
                            <div class="timeline-badge"><i class="bi bi-briefcase-fill timeline-badge-icon"></i></div>
                            <div class="timeline-panel">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h6 class="fw-bold mb-1" th:text="${exp.position}"></h6>
                                        <p class="text-muted mb-1" th:text="${exp.companyName}"></p>
                                        <p class="small text-muted" th:text="${exp.description}"></p>
                                        <span class="badge bg-light text-secondary" th:text="${#temporals.format(exp.startDate, 'MM/yyyy') + ' - ' + (exp.endDate != null ? #temporals.format(exp.endDate, 'MM/yyyy') : 'Hiện tại')}"></span>
                                    </div>
                                    <div th:if="${isReadOnly == null or !isReadOnly}">
                                        <form th:id="${'delete-exp-form-' + exp.experienceId}" th:action="@{/candidate/profile/delete-experience}" method="post" class="d-none">
                                            <input type="hidden" name="experienceId" th:value="${exp.experienceId}">
                                        </form>
                                        <button type="button" class="btn btn-sm btn-outline-danger border-0" th:onclick="'confirmDeleteExp(' + ${exp.experienceId} + ')'">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card profile-section p-4 sticky-top sticky-offset-90">
                    <div class="profile-section-title">
                        <span>Kỹ năng</span>
                        <button th:if="${isReadOnly == null or !isReadOnly}" class="btn btn-sm btn-outline-primary-custom" data-bs-toggle="modal" data-bs-target="#editSkillsModal">
                            <i class="bi bi-pencil me-1"></i> Thay đổi
                        </button>
                    </div>
                    <div th:if="${#lists.isEmpty(profile.skills)}" class="text-muted small">
                        Chưa cập nhật kỹ năng nào.
                    </div>
                    <div th:if="${!#lists.isEmpty(profile.skills)}">
                        <span class="skill-tag" th:each="skill : ${profile.skills}" th:text="${skill.skillName}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="editPersonalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Chỉnh sửa thông tin cá nhân</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/candidate/profile/update-personal}" th:object="${personalForm}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giới tính</label>
                            <select class="form-select" th:field="*{gender}">
                                <option th:each="g : ${T(vn.edu.fpt.hsf302_group5.entity.enums.Gender).values()}" th:value="${g}" th:text="${g.value}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày sinh</label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Địa chỉ chi tiết</label>
                            <input type="text" class="form-control" th:field="*{addressDetail}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Giới thiệu bản thân</label>
                            <textarea class="form-control" rows="4" th:field="*{summary}"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary-custom">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addEducationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Thêm thông tin học vấn</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/candidate/profile/add-education}" th:object="${educationForm}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Trường học</label>
                            <input type="text" class="form-control" th:field="*{schoolName}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Bằng cấp</label>
                            <input type="text" class="form-control" th:field="*{degree}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Chuyên ngành</label>
                            <input type="text" class="form-control" th:field="*{major}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày bắt đầu</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày kết thúc (Để trống nếu đang học)</label>
                            <input type="date" class="form-control" th:field="*{endDate}">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary-custom">Thêm mới</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addExperienceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Thêm kinh nghiệm làm việc</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/candidate/profile/add-experience}" th:object="${experienceForm}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Công ty</label>
                            <input type="text" class="form-control" th:field="*{companyName}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Vị trí đảm nhiệm</label>
                            <input type="text" class="form-control" th:field="*{position}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày bắt đầu</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày kết thúc (Để trống nếu đang làm)</label>
                            <input type="date" class="form-control" th:field="*{endDate}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả công việc</label>
                            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary-custom">Thêm mới</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="editSkillsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Cập nhật kỹ năng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/candidate/profile/update-skills}" method="post">
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-6" th:each="s : ${allSkills}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="skillIds" th:value="${s.skillId}" th:id="${'skill-' + s.skillId}" th:checked="${#lists.contains(profile.skills.![skillId], s.skillId)}">
                                <label class="form-check-label" th:for="${'skill-' + s.skillId}" th:text="${s.skillName}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary-custom">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer.html :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/assets/js/profile.js"></script>
</body>
</html>
