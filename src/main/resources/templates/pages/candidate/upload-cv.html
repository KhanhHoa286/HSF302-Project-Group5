<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý CV - JobPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/candidate.css">
</head>

<body>

    <!-- Header Placeholder -->
    <div th:replace="~{fragments/header.html :: header}"></div>
    <div class="candidate-layout">
        <!-- Sidebar Placeholder -->
        <div th:replace="~{fragments/candidate-sidebar.html :: candidate-sidebar}"></div>

        <main class="candidate-content">
            <h3 class="fw-bold mb-4">Quản lý CV</h3>

            <div class="row">
                <div class="col-lg-8">
                    <form th:action="@{/candidate/upload-cv}" method="post" enctype="multipart/form-data" class="card card-custom p-4 mb-4">
                        <h5 class="fw-bold mb-3">Tải CV lên hệ thống</h5>
                        <p class="text-muted small mb-4">Định dạng hỗ trợ: PDF, DOCX. Dung lượng tối đa: 5MB.</p>

                        <!-- Success & Error Messages -->
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="mb-3">
                            <label for="cvName" class="form-label fw-bold">Tên gợi nhớ cho CV (Tùy chọn)</label>
                            <input type="text" class="form-control" id="cvName" name="cvName" placeholder="Ví dụ: CV_Frontend_Developer">
                        </div>

                        <div class="upload-drop-area mb-3 position-relative" style="cursor: pointer;" onclick="document.getElementById('cvFile').click()">
                            <i class="bi bi-cloud-arrow-up upload-icon"></i>
                            <h5 class="mb-2">Kéo thả file vào đây hoặc click để chọn file</h5>
                            <p class="text-muted mb-3">Chỉ hỗ trợ file PDF hoặc DOCX (Tối đa 5MB)</p>
                            <input type="file" id="cvFile" name="cvFile" style="display: none;" accept=".pdf,.docx" onchange="updateFileName(this)">
                            <div id="selectedFileName" class="fw-bold text-success mt-2"></div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-primary-custom px-4 fw-bold">Tải lên</button>
                        </div>
                    </form>

                    <div class="card card-custom p-4">
                        <h5 class="fw-bold mb-3">Danh sách CV đã tải lên</h5>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tên file</th>
                                        <th>Ngày tải lên</th>
                                        <th class="text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cv : ${cvList}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <i th:class="${#strings.endsWith(#strings.toLowerCase(cv.fileName), '.pdf') ? 'bi bi-file-earmark-pdf text-danger fs-4 me-2' : 'bi bi-file-earmark-word text-primary fs-4 me-2'}"></i>
                                                <span class="fw-500" th:text="${cv.cvName}">CV_NguyenVanA_Frontend.pdf</span>
                                                <small class="text-muted ms-2" th:text="'(' + ${cv.fileName} + ')'"></small>
                                            </div>
                                        </td>
                                        <td class="text-muted" th:text="${#temporals.format(cv.uploadedAt, 'dd/MM/yyyy HH:mm')}">15/11/2026</td>
                                        <td class="text-end">
                                            <div class="d-inline-flex gap-1 align-items-center">
                                                <a th:href="${cv.fileUrl}" target="_blank" class="btn btn-sm btn-outline-primary-custom" title="Xem & Tải xuống">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                                <form th:action="@{/candidate/upload-cv/delete}" method="post" style="display: inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa CV này?')">
                                                    <input type="hidden" name="cvId" th:value="${cv.cvId}">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${cvList == null || cvList.isEmpty()}">
                                        <td colspan="3" class="text-center text-muted py-4">Bạn chưa tải lên CV nào.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer Placeholder -->
    <div th:replace="~{fragments/footer.html :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateFileName(input) {
            const fileNameDiv = document.getElementById('selectedFileName');
            if (input.files && input.files.length > 0) {
                fileNameDiv.textContent = "Đã chọn file: " + input.files[0].name;
            } else {
                fileNameDiv.textContent = "";
            }
        }
    </script>

</body>

</html>
