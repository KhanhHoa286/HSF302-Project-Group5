<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc làm - JobPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link th:if="${#authorization.expression('hasAuthority(''CANDIDATE'')')}" rel="stylesheet" th:href="@{/assets/css/candidate.css}">
    <link th:if="${#authorization.expression('hasAuthority(''RECRUITER'')')}" rel="stylesheet" th:href="@{/assets/css/recruiter.css}">
    <link th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}" rel="stylesheet" th:href="@{/assets/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/header.html :: header(activePage='jobs')}"></div>

<div th:class="${#authorization.expression('hasAuthority(''ADMIN'')')} ? 'admin-layout' : (${#authorization.expression('hasAuthority(''RECRUITER'')')} ? 'recruiter-layout' : 'candidate-layout')">
    <th:block th:if="${#authorization.expression('hasAuthority(''CANDIDATE'')')}">
        <div th:replace="~{fragments/candidate-sidebar.html :: candidate-sidebar}"></div>
    </th:block>
    <th:block th:if="${#authorization.expression('hasAuthority(''RECRUITER'')')}">
        <div th:replace="~{fragments/recruiter-sidebar.html :: recruiter-sidebar}"></div>
    </th:block>
    <th:block th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}">
        <div th:replace="~{fragments/admin-sidebar.html :: admin-sidebar(activePage='jobs')}"></div>
    </th:block>

    <main th:class="${#authorization.expression('hasAuthority(''ADMIN'')')} ? 'admin-content' : (${#authorization.expression('hasAuthority(''RECRUITER'')')} ? 'recruiter-content' : 'candidate-content')">
        <h3 class="fw-bold mb-4">Danh sách việc làm</h3>

        <div class="row">
            <div class="col-lg-3 mb-4">
                <div class="card card-custom filter-card p-3 shadow-sm rounded-12">
                    <h5 class="fw-bold mb-3">Bộ lọc tìm kiếm</h5>

                    <form th:action="@{/candidate/jobs/list-job}" method="get" id="filterForm">
                        <!-- Logic mặc định cho Specifications -->
                        <input type="hidden" name="filterLogicInOtherConditions" value="AND">
                        <input type="hidden" name="filterLogicInSameConditions" value="AND">
                        <input type="hidden" name="search-keyword-operator" value="Contains">
                        <input type="hidden" name="industry-operator" value="=">
                        <input type="hidden" name="province-operator" value="=">
                        <input type="hidden" name="salary-operator" value=">=">
                        <input type="hidden" name="sort" id="sortField" th:value="${sort != null and !sort.isEmpty() ? sort[0] : 'postedDate'}">
                        <input type="hidden" name="sort-operator" id="sortDir" th:value="${sortOperator != null and !sortOperator.isEmpty() ? sortOperator[0] : 'desc'}">

                        <!-- 1. Tiêu đề -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Tiêu đề công việc</label>
                            <input type="text" class="form-control form-control-sm" name="search-keyword" placeholder="Nhập tiêu đề công việc..." th:value="${searchKeyword != null and !searchKeyword.isEmpty() ? searchKeyword[0] : ''}">
                        </div>

                        <!-- 2. Ngành nghề -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Ngành nghề</label>
                            <select class="form-select form-select-sm" name="industry">
                                <option value="-1">Tất cả ngành nghề</option>
                                <option th:each="ind : ${industryResponses}"
                                        th:text="${ind.getIndustryName()}"
                                        th:value="${ind.getIndustryId()}"
                                        th:selected="${industryId != null and !industryId.isEmpty() and industryId[0] == ind.getIndustryId()}"></option>
                            </select>
                        </div>

                        <!-- 3. Địa điểm -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Địa điểm</label>
                            <select class="form-select form-select-sm" name="province">
                                <option value="-1">Tất cả địa điểm</option>
                                <option th:each="prov : ${provinceResponses}"
                                        th:text="${prov.getProvinceName()}"
                                        th:value="${prov.getProvinceId()}"
                                        th:selected="${provinceId != null and !provinceId.isEmpty() and provinceId[0] == prov.getProvinceId()}"></option>
                            </select>
                        </div>

                        <!-- 4. Doanh nghiệp -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Doanh nghiệp</label>
                            <select class="form-select form-select-sm" name="company">
                                <option value="-1">Tất cả doanh nghiệp</option>
                                <option th:each="comp : ${companies}"
                                        th:text="${comp.getCompanyName()}"
                                        th:value="${comp.getCompanyId()}"
                                        th:selected="${companyId != null and !companyId.isEmpty() and companyId[0] == comp.getCompanyId()}"></option>
                            </select>
                        </div>

                        <!-- 4. Lương tối thiểu -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Mức lương tối thiểu</label>
                            <input type="number" class="form-control form-control-sm" name="salary" placeholder="Nhập mức lương..." th:value="${salary != null and !salary.isEmpty() ? salary[0] : ''}">
                        </div>

                        <!-- 5. Sắp xếp -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Sắp xếp</label>
                            <select id="sortSelect" class="form-select form-select-sm">
                                <option value="postedDate-desc" th:selected="${sort != null and !sort.isEmpty() and sort[0] == 'postedDate' and sortOperator[0] == 'desc'}">Mới nhất</option>
                                <option value="postedDate-asc" th:selected="${sort != null and !sort.isEmpty() and sort[0] == 'postedDate' and sortOperator[0] == 'asc'}">Cũ nhất</option>
                                <option value="salaryMax-desc" th:selected="${sort != null and !sort.isEmpty() and sort[0] == 'salaryMax' and sortOperator[0] == 'desc'}">Lương cao nhất</option>
                                <option value="salaryMin-asc" th:selected="${sort != null and !sort.isEmpty() and sort[0] == 'salaryMin' and sortOperator[0] == 'asc'}">Lương thấp nhất</option>
                                <option value="applications-desc" th:selected="${sort != null and !sort.isEmpty() and sort[0] == 'applications' and sortOperator[0] == 'desc'}">Hot nhất (Ứng tuyển nhiều)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">Tìm kiếm</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="row g-3">
                    <div class="col-md-6" th:each="jobPostResponse : ${jobPage.content}">
                        <div class="card card-custom p-3 h-100 d-flex flex-column">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <img th:src="${jobPostResponse.companyLogoUrl}"
                                     alt="Company" class="rounded border p-1 bg-white company-logo-contain-sm">
                                <div>
                                    <h6 class="fw-bold mb-1 text-primary text-truncate max-w-200"
                                        th:text="${jobPostResponse.jobTitle}">Senior Frontend Developer</h6>
                                    <p class="text-muted small mb-0" th:text="${jobPostResponse.companyName}"></p>
                                </div>
                            </div>
                            <div class="d-flex flex-column gap-2 text-muted small mb-3 flex-grow-1">
                                <span>
                                    <i class="bi bi-cash text-success me-2"></i>
                                    <span th:text="${jobPostResponse.salaryMin != null && jobPostResponse.salaryMax != null ? #numbers.formatDecimal(jobPostResponse.salaryMin, 0, 'COMMA', 0, 'POINT') + ' - ' + #numbers.formatDecimal(jobPostResponse.salaryMax, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Thỏa thuận'}"></span>
                                </span>
                                <span>
                                    <i class="bi bi-geo-alt me-2"></i>
                                    <span th:text="${jobPostResponse.getCompanyProvinceAddress()}"></span>
                                </span>
                                <span>
                                    <i class="bi bi-clock text-danger me-2"></i>
                                    <span th:text="${'Hạn nộp: ' + #temporals.format(jobPostResponse.getExpirationDate(), 'dd/MM/yyyy')}"></span>
                                </span>
                            </div>
                            <div class="mt-auto">
                                <a th:href="@{/candidate/jobs/job-detail/{id}(id=${jobPostResponse.getJobId()})}"
                                   class="btn btn-outline-primary-custom w-100">Xem chi tiết</a>
                            </div>
                        </div>
                    </div>
                </div>

                <nav aria-label="Page navigation" class="mt-5">
                    <ul class="pagination justify-content-center">

                        <!-- Previous -->
                        <li class="page-item"
                            th:classappend="${jobPage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/candidate/jobs/list-job(
                                   page=${jobPage.number - 1},
                                   filterLogicInOtherConditions=${filterLogicInOtherConditions},
                                   filterLogicInSameConditions=${filterLogicInSameConditions},
                                   search-keyword=${searchKeyword},
                                   search-keyword-operator=${searchKeywordOperators},
                                   province=${provinceId},
                                   province-operator=${provinceOperators},
                                   industry=${industryId},
                                   industry-operator=${industryOperators},
                                   salary=${salary},
                                   salary-operator=${salaryOperators},
                                   expire=${expireDate},
                                   expire-operator=${expireOperator},
                                   sort=${sort},
                                   sort-operator=${sortOperator}
                               )}">
                                Trước
                            </a>
                        </li>

                        <!-- Danh sách số trang -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(startPage,endPage)}"
                            th:classappend="${i == jobPage.number} ? 'active'">

                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{/candidate/jobs/list-job(
                                   page=${i},
                                   filterLogicInOtherConditions=${filterLogicInOtherConditions},
                                   filterLogicInSameConditions=${filterLogicInSameConditions},
                                   search-keyword=${searchKeyword},
                                   search-keyword-operator=${searchKeywordOperators},
                                   province=${provinceId},
                                   province-operator=${provinceOperators},
                                   industry=${industryId},
                                   industry-operator=${industryOperators},
                                   salary=${salary},
                                   salary-operator=${salaryOperators},
                                   expire=${expireDate},
                                   expire-operator=${expireOperator},
                                   sort=${sort},
                                   sort-operator=${sortOperator}
                               )}">
                            </a>

                        </li>

                        <!-- Next -->
                        <li class="page-item"
                            th:classappend="${jobPage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/candidate/jobs/list-job(
                                   page=${jobPage.number + 1},
                                   filterLogicInOtherConditions=${filterLogicInOtherConditions},
                                   filterLogicInSameConditions=${filterLogicInSameConditions},
                                   search-keyword=${searchKeyword},
                                   search-keyword-operator=${searchKeywordOperators},
                                   province=${provinceId},
                                   province-operator=${provinceOperators},
                                   industry=${industryId},
                                   industry-operator=${industryOperators},
                                   salary=${salary},
                                   salary-operator=${salaryOperators},
                                   expire=${expireDate},
                                   expire-operator=${expireOperator},
                                   sort=${sort},
                                   sort-operator=${sortOperator}
                               )}">
                                Sau
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer.html :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const filterForm = document.getElementById('filterForm');
        const sortSelect = document.getElementById('sortSelect');
        const sortField = document.getElementById('sortField');
        const sortDir = document.getElementById('sortDir');

        // Đồng bộ bộ chọn Sắp xếp với hidden fields
        if (sortSelect) {
            sortSelect.addEventListener('change', function () {
                const val = this.value;
                const parts = val.split('-');
                sortField.value = parts[0];
                sortDir.value = parts[1];
            });
        }

        // Tối ưu hóa gửi form
        if (filterForm) {
            filterForm.addEventListener('submit', function () {
                // Vô hiệu hóa các ô nhập liệu rỗng hoặc mang giá trị mặc định/Tất cả (-1)
                // để không gửi tham số rỗng lên server (giúp backend bỏ qua bộ lọc đó)
                filterForm.querySelectorAll('input, select').forEach(input => {
                    if (input.id === 'sortField' || input.id === 'sortDir' || input.type === 'hidden') {
                        return;
                    }
                    if (input.value === "" || input.value === "-1") {
                        input.disabled = true;
                    }
                });
            });
        }
    });
</script>

</body>
</html>
